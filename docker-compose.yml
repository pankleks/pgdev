services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgdev
      POSTGRES_DB: pgdev
    ports:
      - "5433:5432"
    volumes:
      - ./sample/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdev_data:/var/lib/postgresql/data

volumes:
  pgdev_data:
