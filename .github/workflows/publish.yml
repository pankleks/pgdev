name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example, v0.5.4)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PGDEV_TEST_URL: postgres://postgres:pgdev@localhost:5432/postgres
      RELEASE_REF: ${{ inputs.tag || github.ref }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pgdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          TAG="${RELEASE_REF##refs/tags/}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "Release tag $TAG does not match package version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish package
        run: npm publish
